[project]
name = "loantracker"
version = "0.1.0"
description = "Loan payoff tracker with NiceGUI"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=1.4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


